; SKGraphics texture categories - edit manually; restart the game after changes.
; Place this file beside d3d9.dll and SKGraphics.ini.
;
; Add original texture hashes beneath any category you choose.
; Plain hashes are enough; filenames/extensions and descriptions are optional.
; Do not type angle brackets. In the examples below, HASH means the original
; 64-character hexadecimal hash, not the literal word HASH.
; HASH=Optional description
; HASH.dds=Optional description
; HASH.png=Optional description
;
; Examples below are commented out. Replace HASH with a real texture hash.
; Hashes/extensions and ASCII category names are case-insensitive.
; Labels after = are ignored by the mod; they are for your reference.
; A texture can belong to several categories; any listed match counts.
; Do not use commas in category names (commas separate filter selections).
; Save as plain text; ASCII names are simplest. UTF-16 LE with BOM supports
; Unicode section names and labels through Windows INI APIs.

[Menus]
; HASH=Title background

[Effects]
; HASH=Smoke

[Characters]
