; SKGraphics presets for the in-game menu (F9 by default).
;
; Choosing "Apply selected preset" in the menu writes the values below into
; SKGraphics.ini. Bloom and the other live settings change straight away;
; resolution, shadow size and the rest apply after restarting the game.
;
; Format: up to eight sections, [Preset1] to [Preset8], numbered without gaps.
; Name= is what the menu shows (43 characters at most). Every other line is
; Section.Key=Value, using the section and key names from SKGraphics.ini.
; Only these sections can be changed by a preset: Rendering, Antialiasing,
; Shadows, Bloom, AmbientOcclusion, Outlines and Movies. Lines for any other
; section are ignored and reported in the log.
;
; The resolutions below are 16:9, like the game's picture. On screens of
; another shape the mod fits them automatically (see the log).
; Higher presets need much more video memory: 7680 x 4320 rendering with
; 16384 shadows is very demanding.
; Presets do not switch bloom or ambient occlusion on or off; they only set
; their values to suit the preset, so they look right whenever they are on.

[Preset1]
Name=SKGraphics Lite (2560 x 1440)
Rendering.Enabled=1
Rendering.Width=2560
Rendering.Height=1440
Antialiasing.Method=1
Antialiasing.Strength=100
Antialiasing.Span=8
Antialiasing.EdgeThreshold=125
Antialiasing.MinimumThreshold=31
Shadows.Enabled=1
Shadows.Resolution=8192
Shadows.Filter=1
Shadows.FilterRadius=75
Shadows.ActorShadows=1
Shadows.Coverage=1
Outlines.Enabled=1
Outlines.Thickness=100
Outlines.Opacity=100
Bloom.Strength=100
Bloom.Threshold=500
Bloom.Knee=110
Bloom.Radius=75
Bloom.Composite=2
Bloom.Brightness=1
AmbientOcclusion.Strength=280
AmbientOcclusion.Radius=25
AmbientOcclusion.Quality=1
AmbientOcclusion.Bias=10
AmbientOcclusion.MaxDistance=0
AmbientOcclusion.ExcludeCharacters=1
AmbientOcclusion.ExcludeTransformationBackgrounds=1

