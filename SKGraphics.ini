; SKGraphics - 1.0 release preset.
; Restart the game after changes. Use whole numbers for numeric settings.
; Each option is followed by its description, then a blank line.
; This preset intentionally enables enhancements. Missing options use the
; DLL's fallback values, which preserve original visuals unless requested.
; Outlines Enabled=1 means keep the original outlines visible.

[Rendering]

Enabled=1
; 0 = use the game's output resolution; 1 = use Width and Height below.
; Rendering larger than the output can smooth edges and reveal finer detail,
; but increases GPU work and memory use. Requires windowed/borderless mode.

Width=3840
; Internal rendering width in pixels. Range: 320..16384. Requires Enabled=1.
; Width and Height must exactly match the game output's aspect ratio.
; For 16:9: 2560x1440, 3840x2160, 5120x2880 or 7680x4320.
; See SKGraphics_Resolutions.txt for other ratios and hardware limitations.

Height=2160
; Internal rendering height in pixels. Range: 180..16384. Requires Enabled=1.
; Change this together with Width; for example, Width=3840 and Height=2160.
; These settings change rendering detail, not your monitor's display mode.

[Antialiasing]

Method=1
; 0 = off; 1 = FXAA-style smoothing; 2 = SMAA 1x.
; Both reduce jagged edges. FXAA can look softer; SMAA is often more subtle.
; This is a final-image effect and can also soften text and interface elements.

Strength=100
; Blend strength, 0..100 percent. Requires Method=1 or 2.
; 100 applies the full result; lower values retain more of the original image.
; 0 bypasses antialiasing.

SMAAQuality=2
; SMAA only (Method=2): 0 = Low, 1 = Medium, 2 = High, 3 = Ultra.
; Higher settings perform more edge searches and can cost more GPU time.

Span=8
; FXAA only (Method=1). Range: 1..16, in rendered-image pixels.
; Maximum smoothing search span. Higher values can smooth longer edges
; but may also soften more detail.

EdgeThreshold=125
; FXAA only (Method=1). Range: 0..1000; value is divided by 1000.
; Contrast threshold relative to local brightness. Lower values smooth
; more subtle edges; higher values leave more of them untouched.

MinimumThreshold=31
; FXAA only (Method=1). Range: 0..1000; value is divided by 1000.
; Minimum contrast needed for smoothing, especially in dark areas.
; Lower values catch faint edges; higher values preserve more dark detail.

[Shadows]

Enabled=1
; 0 = keep the original shadow-map size; 1 = use Resolution below.
; This switch controls resolution only. Filter is independent.
; Only the existing animated player shadow is resized; enemy circle shadows
; retain their original behavior. The size patch supports the verified GOG and Steam 01.06 builds.

Resolution=8192
; Allowed sizes: 1024, 2048 (original), 4096, 8192, 12288. Requires Enabled=1.
; Higher values sharpen the animated shadow's silhouette but use more memory.
; The two buffers total roughly 128 MiB at 4096, 512 MiB at 8192, and
; 1.125 GiB at 12288, before driver overhead. If capability/allocation checks
; fail, the game keeps its original 2048 size.

Filter=2
; 0 = original hard edges; 1 = 3x3 filter; 2 = 5x5 filter.
; Filtering blends 9 or 25 shadow comparisons to soften jagged edges.
; Works independently of Enabled; higher quality costs more GPU work.

FilterRadius=125
; Requires Filter=1 or 2. Range: 25..800, in hundredths of a shadow-map pixel.
; 125 means 1.25 pixels. Higher values spread the samples farther apart,
; softening edges more, but very wide settings may reveal separate samples.
; The same value looks tighter when shadow resolution is increased.

[Outlines]

Enabled=1
; 0 = remove the identified character outlines; 1 = keep them visible.
; 1 preserves the game's normal outlines. This is not a master switch
; that disables customization when set to 0.

Thickness=100
; Outline width as a percentage of the original, 25..400. Requires Enabled=1.
; 100 = original width; 50 = thinner; 200 = twice the original expansion.
; The visible width also depends on the model and camera.

ColorOverride=0
; 0 = original outline color; 1 = use Red, Green and Blue below.
; Requires Enabled=1. This chooses a fixed color rather than matching
; the character's textures automatically.

Red=0
; Red component of the custom outline color, 0..255. Requires ColorOverride=1.

Green=0
; Green component of the custom outline color, 0..255. Requires ColorOverride=1.

Blue=0
; Blue component of the custom outline color, 0..255. Requires ColorOverride=1.
; Red=0, Green=0, Blue=0 gives black; all three at 255 gives white.

[Bloom]

Enabled=0
; 0 = off; 1 = experimental glow around bright parts of the 3D scene.
; Runs before the identified interface passes so HUD elements do not glow.

Strength=30
; Glow amount, 0..200 percent. Requires Enabled=1.
; Higher values make the glow brighter; 0 adds no glow.

Threshold=400
; Brightness cutoff, 0..1000 (divided by 1000). Requires Enabled=1.
; Lower values let more of the scene glow; higher values restrict glow
; to brighter areas.

Knee=40
; Softness of the brightness cutoff, 0..500 (divided by 1000).
; Requires Enabled=1. Higher values make the transition into glow more gradual;
; 0 uses a hard cutoff.

Radius=400
; Glow spread, 25..400. Requires Enabled=1. 100 is the reference spread.
; Higher values create a broader halo. Spread scales with render height
; to keep a similar appearance at different rendering resolutions.

[AmbientOcclusion]

Enabled=0
; 0 = off; 1 = experimental screen-space ambient occlusion (SSAO).
; Adds shading around nearby surfaces and creases using visible scene depth.
; It approximates contact shading and can produce halos or shade distant
; backdrops; it is not a replacement for the game's real lighting.

ExcludeCharacters=1
; 0 = apply AO to all surfaces; 1 = prevent identified actors receiving AO.
; Requires Enabled=1. Actors still contribute to AO on surrounding scenery.
; Adds geometry draws and a full-resolution mask (about 56 MiB at 5120x2880).
; Coverage is based on tested actor shaders; unusual models may differ.

Strength=200
; AO darkness, 0..300 percent. Requires Enabled=1.
; Higher values make the added shading darker; 0 adds no AO shading.

Radius=30
; Sampling radius, 1..200 game-world units. Requires Enabled=1.
; Higher values shade broader gaps and surrounding areas; lower values
; concentrate shading around small creases and close contact.

Quality=3
; 1 = 8 samples, 2 = 16 samples, 3 = 32 samples. Requires Enabled=1.
; More samples improve sampling quality at greater GPU cost. AO is computed
; at half the render width and height, then applied to the full image.

Bias=10
; Angular bias, 0..50 (divided by 100). Requires Enabled=1.
; Higher values reduce unwanted self-darkening on surfaces, but can also
; remove subtle contact shading.

MaxDistance=0
; Optional view-depth cutoff, 0..100000 game-world units. Requires Enabled=1.
; 0 = no distance cutoff. Positive values fade AO over the final 25 percent
; of this distance. It affects all distant geometry, not just skyboxes.

DepthView=0
; Diagnostic preview: 0 = normal image; 1 = display scene depth.
; Works independently of Enabled and Logging. Replaces the normal AO/bloom
; result with a depth preview for troubleshooting; leave at 0 for play.

DepthScale=100
; Depth-preview scale, 1..100000. Used only with DepthView=1.
; Adjusts how depth is mapped to the preview; it does not change normal AO
; strength, radius or distance limits.

[Textures]

Replace=0
; 0 = off; 1 = load matching replacement textures.
; Place files in SKGraphics_Textures/replace beside the mod. Use the original
; dumped texture's hash as the filename, with .dds or .png; DDS takes priority.
; Replacement is independent of dumping and its category filters.

UseReplacementSize=0
; Requires Replace=1. 0 = resize replacements to the original dimensions;
; 1 = retain the replacement's dimensions. Larger replacements can add detail
; but use more memory and may not suit every texture.

Dump=0
; 0 = off; 1 = export encountered supported original textures as DDS files
; to SKGraphics_Textures/dump. Existing dumps are not overwritten.
; Dumping can cause loading delays or stutters and consumes disk space.

DumpLimit=2000
; Maximum number of new dump files per launch, 0..10000. Requires Dump=1.
; 2000 permits up to 2000 new files; 0 prevents dumping, not unlimited.
; Existing files do not count toward this launch's limit.

MaxDumpMiB=512
; Maximum combined size of new dumps per launch, 0..2048 MiB. Requires Dump=1.
; This is a disk-output limit, not a total RAM/VRAM limit. 0 prevents dumping.
; DumpLimit and this limit both apply; a file must fit within the remaining size.

DumpCategoryMode=All
; Requires Dump=1. All = all categorized textures; Include = only textures
; in DumpCategories; Exclude = all categorized textures except those listed.
; Uncategorized textures are controlled separately by DumpUncategorized.
; Categories are read from SKGraphics_TextureCategories.ini.

DumpCategories=
; Comma-separated category names used by Include or Exclude mode.
; Example: Main Menu, Characters, Effects. Names may contain spaces.
; Leave empty when using All. If a texture belongs to several categories,
; a match in any selected category is enough to include or exclude it.

DumpUncategorized=1
; Requires Dump=1. 0 = skip textures absent from every category;
; 1 = allow them to dump. Applies in All, Include and Exclude modes.
; Keep 1 to discover new textures; use 0 for strictly categorized dumps.

[Diagnostics]

Logging=0
; 0 = no SKGraphics log files; 1 = write SKGraphics.log and permit capture logs.
; Old logs remain untouched when off. This does not control ReShade logging.
; Logging alone does not enable any capture probes.

MaxLogEvents=4000
; Main-log event limit per launch, 100..20000. Requires Logging=1.
; Limits log growth. It does not set the separate scene-capture line limit.

SceneProbe=0
; Requires Logging=1. 0 = off; 1 = enable F8 single-frame scene captures.
; Up to three captures per launch go to SKGraphics_SceneProbe.log.
; For troubleshooting draw order; leave off for normal play.

AOProbe=0
; Requires Logging=1 and SceneProbe=1. 0 = off; 1 = add depth and camera
; metadata to F8 scene captures. Does not enable the AO visual effect.

ShadowProbe=0
; Requires Logging=1. 0 = off; 1 = collect additional shadow diagnostics.
; For troubleshooting shadow rendering; leave off for normal play.

CharacterPreview=0
; 0 = normal colors; 1 = diagnostic tint showing shader classifications.
; Cyan identifies actor candidates; amber identifies the tested floating-icon
; class. Works without Logging. Disable this when evaluating normal AO
; character exclusion or playing normally.

[Compatibility]

LoadReShade=0
; 0 = load system D3D9 normally; 1 = load ReShade/d3d9.dll beneath SKGraphics.
; Requires a separately installed 32-bit ReShade DLL in that subfolder.
; The game-folder d3d9.dll must remain SKGraphics. For the tested arrangement,
; keep ReShade.ini beside the game EXE with [PROXY] EnableProxyLibrary=0 and
; [INSTALL] BasePath=.. . See the ReShade section in README.txt.
; Enabling this without a valid ReShade backend can prevent game startup.
