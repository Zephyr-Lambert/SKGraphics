; SKGraphics 2.0 - settings file
; These values match the "SKGraphics Standard" preset. Most settings can also
; be changed in game with the settings menu (F9 by default).
; Missing options keep the original game look, so any line can be deleted.
; [Live] = can be changed while the game runs (in the menu, or by saving this
; file when LiveReload=1). Everything else needs a game restart.

[Rendering]
Enabled=1
; 1 = render the 3D scene at Width x Height (supersampling). 0 = original.
Width=3840
Height=2160
; Use a 16:9 size: the game always draws a 16:9 picture. On other screen
; shapes (Steam Deck, ultrawide) it is enlarged automatically to cover the
; game's black bars. Borderless window mode (or windowed); fullscreen is not
; supported. See SKGraphics_Resolutions.txt.

[Antialiasing]
Method=1
; [Live] 0 = off, 1 = FXAA-style (recommended), 2 = SMAA 1x (experimental:
; a subtle effect in this game; FXAA is recommended).
Strength=100
; [Live] 0-100. Blend between the original and the smoothed image.
Span=8
; [Live] FXAA only. 1-16. Longest edge search; higher smooths longer edges.
EdgeThreshold=125
; [Live] FXAA only. 0-1000 (thousandths). Lower = more edges smoothed.
MinimumThreshold=31
; [Live] FXAA only. 0-1000 (thousandths). Skips very dark low-contrast edges.
SMAAQuality=2
; SMAA only. 0 = low, 1 = medium, 2 = high, 3 = ultra.

[Shadows]
Enabled=1
; 1 = change the player shadow map size below. 0 = original 2048.
Resolution=12288
; 1024, 2048 (original), 4096, 8192, 12288 or 16384. Larger sizes need much
; more video memory: 16384 uses about 2 GB, 12288 about 1.1 GB.
Filter=2
; 0 = original, 1 = 3x3 soft filtering, 2 = 5x5 soft filtering.
FilterRadius=95
; 25-800 (hundredths of a shadow-map texel). Width of the soft filtering.
ActorShadows=2
; [Live] 0 = player only (original), 1 = also CPU-controlled characters,
; 2 = also crowd enemies. Their circle shadows are hidden when replaced.
Coverage=2
; [Live] Shadow area: 0 = original, 1 = 2x wider, 2 = 3x wider.

[Outlines]
Enabled=1
; 1 = character outlines visible (original). 0 = hidden.
Thickness=100
; 25-400 (percent of the original thickness).
ColorOverride=0
; 1 = draw outlines in the fixed color below. 0 = original colors.
Red=0
Green=0
Blue=0
; 0-255 each. Used only when ColorOverride=1.
Opacity=100
; Experimental. 0-100. Not consistent around every silhouette.

[Bloom]
Enabled=0
; [Live] Glow on 3D scenes, applied before the interface is drawn.
; Can be switched off and on live only if it was on at startup.
Strength=100
; [Live] 0-200 (percent).
Threshold=500
; [Live] 0-1000 (thousandths). Brightness where glow starts; lower = more glow.
Knee=110
; [Live] 0-500 (thousandths). Softness of the threshold transition.
Radius=75
; [Live] 25-400 (percent). Size of the glow.
Composite=2
; [Live] How glow is combined with the scene:
; 0 = add (original; can wash out bright scenes), 1 = screen (softer),
; 2 = tone-mapped (untouched pixels stay the same, highlights roll off,
;     colors keep their hue).
Brightness=1
; [Live] What counts as bright: 0 = brightest color channel (original),
; 1 = luminance (vivid but not truly bright colors glow less).

[AmbientOcclusion]
Enabled=0
; [Live] Experimental contact shading. Very demanding: by far the most
; expensive effect. Can be switched off and on live only if it was on at
; startup.
Strength=280
; [Live] 0-300 (percent).
Radius=25
; [Live] 1-200 (world units). Reach of the shading.
Quality=2
; [Live] 1 = 8 samples, 2 = 16, 3 = 32.
Bias=10
; [Live] 0-50 (hundredths). Higher reduces shading on flat surfaces.
MaxDistance=0
; [Live] 0 = no limit. Otherwise AO fades out at this distance (keeps it off
; far scenery and the sky).
ExcludeCharacters=1
; [Live] 1 = characters do not receive AO (they still shade scenery near them).
ExcludeTransformationBackgrounds=1
; [Live] 1 = the identified transformation backdrops do not receive AO.
DepthView=0
; Debugging only: 1 = show the depth buffer instead of the game.
DepthScale=100
; Debugging only: 1-100000. Contrast of the DepthView image.

[Movies]
Enabled=0
; 1 = apply the volume below to video playback (GOG and Steam 01.06).
; 0 = original movie volume.
Volume=100
; [Live] 0-100 (percent; 0 = mute). Applies from the next video played.

[Textures]
Dump=0
; 1 = save encountered original textures to SKGraphics_Textures\dump.
DumpLimit=2000
; 0-10000. Most new textures saved per launch (0 = none).
MaxDumpMiB=512
; 0-2048. Most new megabytes saved per launch.
DumpCategoryMode=All
; All, Include or Exclude. Filters dumping using the categories listed below,
; which are defined in SKGraphics_TextureCategories.ini.
DumpCategories=
; Comma-separated category names, for example: Main Menu,Stages
DumpUncategorized=1
; 1 = also dump textures that are in no category. 0 = skip them.
Replace=0
; 1 = load replacements from SKGraphics_Textures\replace (.dds or .png named
; by the 64-character hash; .dds wins if both exist).
UseReplacementSize=0
; 0 = resize replacements to the original size. 1 = keep their own size.

[Compatibility]
LiveReload=0
; For people who prefer editing this file directly instead of using the
; in-game menu: 1 = apply [Live] settings whenever this file is saved while
; the game runs. 0 = read this file only at startup (the menu still works).
; Off by default so the file is not checked for changes during play.
Menu=1
; 1 = in-game settings menu. 0 = off.
; While open: 1 / 2 select a setting, - / = change it (hold to repeat).
; The game still receives these keys and buttons. "Save to SKGraphics.ini" in the menu
; writes the values here; "Discard changes" reloads this file.
; Presets shown in the menu come from SKGraphics_Presets.ini.
MenuKey=9
; Function key that opens and closes the menu: 1-12 (F1-F12). Default F9.
; Avoid 8 (F8 is used by SceneProbe) and 10 (F10 is a Windows system key).
MenuController=1
; 1 = a controller can also use the menu: LB + RB + Back + Start together
; open/close it (L + R + - + + on Switch-style, L1 + R1 + Share + Options on
; PlayStation-style), D-pad up/down select, left/right change. 0 = keyboard
; only. Works with Xbox-style (XInput) controllers and with controllers
; Windows sees as joysticks, such as PlayStation controllers.
LoadReShade=0
; 1 = load ReShade from ReShade\d3d9.dll (see README for the setup).
; A missing ReShade DLL can prevent the game from starting.

; ==========================================================================
; TROUBLESHOOTING AND DEBUGGING ONLY
; Leave everything below at 0 for normal play. These options exist to help
; diagnose problems on other hardware. Some tint the image, write large log
; files or reduce performance.
; ==========================================================================

[Diagnostics]
Logging=0
; 1 = write SKGraphics.log beside the game. 0 = no log.
MaxLogEvents=4000
; 100-20000. Log lines written per launch.
ActorShadowCollectOnly=0
; [Live] 1 = find extra character shadows but do not draw them (to check
; whether a slowdown comes from finding or drawing). Needs ActorShadows 1-2.
CharacterPreview=0
; 1 = tint detected characters (cyan/amber) to check AO character detection.
CirclePreview=0
; 1 = tint candidate circle shadows cyan.
SceneProbe=0
; 1 = press F8 in game to record a detailed frame report (3 per launch) to
; SKGraphics_SceneProbe.log. Needs Logging=1.
ActorShadowProbe=0
; 1 = include character shadow details in SceneProbe captures.
BackgroundProbe=0
; 1 = include background texture details in SceneProbe captures.
ShadowProbe=0
; 1 = log shadow shader details. Needs Logging=1.
AOProbe=0
; 1 = log AO depth and constant details. Needs Logging=1.
BloomStateBlock=0
; [Live] 1 = bloom and AO save the game's drawing state the 1.x way (a
; Direct3D state block). Can cause flashing colors on some Windows drivers.
; Only for comparing behavior when reporting a problem.
